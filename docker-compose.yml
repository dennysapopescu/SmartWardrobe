services:
  postgres:
    image: postgres:14-alpine
    container_name: smartwardrobe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartwardrobe}
      POSTGRES_USER: ${POSTGRES_USER:-smartwardrobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartwardrobe}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartwardrobe} -d ${POSTGRES_DB:-smartwardrobe}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartwardrobe-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartwardrobe}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smartwardrobe}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-smartwardrobe}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartwardrobe-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  postgres_data:
  backend_uploads:
