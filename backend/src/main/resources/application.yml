server:
  port: 8080

spring:
  application:
    name: smart-wardrobe-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/smartwardrobe
    driverClassName: org.postgresql.Driver
    username: ${DB_USER:smartwardrobe}
    password: ${DB_PASSWORD:smartwardrobe}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 604800000 # 7 days
  upload:
    dir: uploads
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-1.5-flash
  weather:
    base-url: https://api.open-meteo.com/v1/forecast

---
# H2 fallback profile
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/wardrobedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
