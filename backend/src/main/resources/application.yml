server:
  port: 8080

spring:
  application:
    name: smart-wardrobe-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/smartwardrobe
    driverClassName: org.postgresql.Driver
    username: ${DB_USER:smartwardrobe}
    password: ${DB_PASSWORD:smartwardrobe}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload:
    dir: uploads
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-1.5-flash
  weather:
    base-url: https://api.open-meteo.com/v1/forecast

---
# H2 fallback profile
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/wardrobedb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
